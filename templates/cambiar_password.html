{% extends "base.html" %}
{% block titulo %}Cambiar contraseña - Alma Buffet{% endblock %}
{% block contenido %}
<div class="page-heading"><div><h1>Cambiar contraseña</h1><p>Debe establecer una contraseña personal antes de continuar.</p></div></div>
<form class="card form-card-narrow" method="post" action="{{ url_for('autenticacion.guardar_password') }}">
    <input type="hidden" name="_token_csrf" value="{{ token_csrf() }}">
    <div class="card-body">
        <label class="form-label">Contraseña actual</label><input class="form-control mb-3" type="password" name="password_actual" required>
        <label class="form-label">Nueva contraseña</label><input class="form-control mb-2" type="password" name="password_nueva" minlength="8" required>
        <small class="text-muted">Incluya mayúscula, minúscula, número y símbolo.</small>
        <label class="form-label mt-3">Confirmar contraseña</label><input class="form-control mb-4" type="password" name="password_confirmacion" minlength="8" required>
        <button class="btn btn-primary">Actualizar contraseña</button>
    </div>
</form>
{% endblock %}
